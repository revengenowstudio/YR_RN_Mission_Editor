name: Basic verify

on:
  pull_request:
    branches: 
      - "main"
      - "RN"
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: windows-2022
    env:
      CONFIGURATION: FinalAlertDebug YR

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive
        lfs: true
    - name: setup-msvc
      uses: egor-tensin/vs-shell@v2
      with:
        # Target architecture
        arch: x64
    - name: Restore cache vcpkg
      uses: actions/cache/restore@v4
      with:
        path: |
          3rdParty/xcc/vcpkg_downloads
          3rdParty/xcc/vcpkg_installed
          C:/Users/runneradmin/AppData/Local/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('3rdParty/xcc/vcpkg.json') }}
    - name: Vcpkg install
      run: |
        cd 3rdParty/xcc
        $env:VCPKG_DOWNLOADS = $PWD.Path
        vcpkg install `
          --x-wait-for-lock `
          --triplet "x64-windows" `
          --x-manifest-root="$PWD.Path\" `
          --x-install-root="$PWD.Path\vcpkg_installed\x64-windows\"
        ls
        ls vcpkg_installed/x64-windows
        # disable auto pkg in vcxproj
        $vcxprojPath = "Library\XCC Library.vcxproj"
        $content = Get-Content $vcxprojPath
        $updatedContent = $content -replace '<VcpkgEnableManifest>true</VcpkgEnableManifest>', '<VcpkgEnableManifest>false</VcpkgEnableManifest>'
        $updatedContent | Set-Content $vcxprojPath
    - name: Build Main Program (MSVC)
      run: |
        devenv.com "MissionEditor.sln"  /Build "${{ env.CONFIGURATION }}|x64" /project MissionEditor
    - name: Build UT tool (MSVC)
      env:
        VCPKG_ENABLE_MANIFEST: "0"
      run: |
        devenv.com "MissionEditor.sln"  /Build "${{ env.CONFIGURATION }}|x64" /project UnitTest
    - name: Cache vcpkg
      uses: actions/cache/save@v4
      with:
        path: |
          3rdParty/xcc/vcpkg_downloads
          3rdParty/xcc/vcpkg_installed
          C:/Users/runneradmin/AppData/Local/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('3rdParty/xcc/vcpkg.json') }}
    - name: do UT
      run: |
        cd x64\Debug
        ./UnitTest
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RN-Mission-Editor-pr-${{ github.run_number }}
        path: dist/FinalAlert2YR