name: Basic verify

on:
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - 'image/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: windows-2022
    env:
      CONFIGURATION: FinalAlertDebug YR

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive
        lfs: true
    - name: setup-msvc
      uses: egor-tensin/vs-shell@v2
      with:
        # Target architecture
        arch: x64
    - name: Get Vcpkg Version Hash
      id: vcpkg-version
      shell: powershell
      run: |
        $vcpkgPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg\vcpkg.exe"
        $hash = (Get-FileHash $vcpkgPath).Hash
        echo "vcpkg_exe_hash=$hash" >> $env:GITHUB_OUTPUT    
    - name: Cache or restore vcpkg
      uses: actions/cache@v4
      with:
        path: |
          3rdParty/xcc/vcpkg_downloads
          3rdParty/xcc/vcpkg_installed
          3rdParty/xcc/binary-cache
          C:/Users/runneradmin/AppData/Local/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ steps.vcpkg-version.outputs.vcpkg_exe_hash }}-${{ hashFiles('3rdParty/xcc/vcpkg.json') }}
    - name: Vcpkg install
      run: |
        cd 3rdParty/xcc
        if (-not (Test-Path "binary-cache")) {
            mkdir "binary-cache"
        }
        $env:VCPKG_DOWNLOADS = $PWD
        $env:VCPKG_BINARY_SOURCES="files,$PWD\binary-cache,readwrite"
        $vcpkgPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg"
        # rm "$vcpkgPath\.vcpkg-root"
        & "$vcpkgPath\vcpkg" install `
          --x-wait-for-lock `
          --triplet "x64-windows" `
          --vcpkg-root $vcpkgPath `
          --x-manifest-root="$PWD\" `
          --x-install-root="$PWD\vcpkg_installed\x64-windows"
        ls
        ls vcpkg_installed/x64-windows/x64-windows
        ls vcpkg_installed/x64-windows/x64-windows/include
    - name: Build Main Program (MSVC)
      run: |
        MSBuild MissionEditor.sln /m /p:Configuration="${{ env.CONFIGURATION }}" /p:Platform=x64 /t:MissionEditor
    - name: Build UT tool (MSVC)
      env:
        VCPKG_ENABLE_MANIFEST: "0"
      run: |
        MSBuild MissionEditor.sln /m /p:Configuration="${{ env.CONFIGURATION }}" /p:Platform=x64 /t:UnitTest
    - name: do UT
      run: |
        cd x64\Debug
        ./UnitTest
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FinalRevenge-pr-${{ github.run_number }}
        path: dist/FinalRevenge
        retention-days: 7
