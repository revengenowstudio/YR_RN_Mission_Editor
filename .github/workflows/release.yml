name: Release Product
permissions:
  write-all

on:
  pull_request:
    branches:
      - "main"
      - "RN"
    types:
      - closed
  workflow_dispatch: {}

env:
  VERSION_MAJOR: 2
  VERSION_MINOR: 2
  VERSION_REV_OFFSET: 41
  RELEASE_VER: ''
  PACKAGE_NAME: ''
  IS_PRERELEASE: false

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true)
    runs-on: windows-2022
    env:
      CONFIGURATION: FinalAlertRelease YR
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive
        lfs: true
    - name: setup-msvc
      uses: egor-tensin/vs-shell@v2
      with:
        # Target architecture
        arch: x64
    - name: Handle version
      shell: bash
      run: |
        revNum=$((${{ github.run_number }} - ${{ env.VERSION_REV_OFFSET }}))
        versionNum=${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.$revNum
        pkgName=RN-Mission-Editor-v$versionNum.zip
        ./scripts/update_product_version.ps1 -major ${{ env.VERSION_MAJOR }} -minor ${{ env.VERSION_MINOR }} -revision $revNum
        echo "RELEASE_VER=$versionNum" >> $GITHUB_ENV
        echo "PACKAGE_NAME=$pkgName" >> $GITHUB_ENV
    - name: Restore cache vcpkg
      uses: actions/cache/restore@v4
      with:
        path: |
          3rdParty/xcc/vcpkg_downloads
          3rdParty/xcc/vcpkg_installed
          3rdParty/xcc/binary-cache
          C:/Users/runneradmin/AppData/Local/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('3rdParty/xcc/vcpkg.json') }}
    - name: Vcpkg install
      run: |
        cd 3rdParty/xcc
        if (-not (Test-Path "binary-cache")) {
            mkdir "binary-cache"
        }
        $env:VCPKG_DOWNLOADS = $PWD
        $env:VCPKG_BINARY_SOURCES="files,$PWD\binary-cache,readwrite"
        $vcpkgPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg"
        # rm "$vcpkgPath\.vcpkg-root"
        & "$vcpkgPath\vcpkg" install `
          --x-wait-for-lock `
          --triplet "x64-windows" `
          --vcpkg-root $vcpkgPath `
          --x-manifest-root="$PWD\" `
          --x-install-root="$PWD\vcpkg_installed\x64-windows"
        ls
        ls vcpkg_installed/x64-windows
        ls vcpkg_installed/x64-windows/x64-windows
    - name: build-msvc
      run: |
        MSBuild MissionEditor.sln /m /p:Configuration="${{ env.CONFIGURATION }}" /p:Platform=x64 /t:MissionEditor
    - name: Cache vcpkg
      uses: actions/cache/save@v4
      with:
        path: |
          3rdParty/xcc/vcpkg_downloads
          3rdParty/xcc/vcpkg_installed
          3rdParty/xcc/binary-cache
          C:/Users/runneradmin/AppData/Local/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('3rdParty/xcc/vcpkg.json') }}
    - name: Pack up
      shell: pwsh
      run: |
        cd dist/FinalAlert2YR
        Compress-Archive -Path ./* -DestinationPath ../${{ env.PACKAGE_NAME }}
    - name: Release - ${{ env.RELEASE_VER }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_VER }}
        name: ${{ env.RELEASE_VER }}
        files: dist/${{ env.PACKAGE_NAME }}
        target_commitish: ${{ github.ref }}
        prerelease: ${{ env.IS_PRERELEASE }}
